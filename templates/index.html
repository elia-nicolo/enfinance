<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetScope</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>AssetScope</h1>
            <p class="subtitle">Analisi dei mercati finanziari globali</p>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="peggiori">Peggiori</button>
            <button class="tab-btn" data-tab="migliori">Migliori</button>
            <button class="tab-btn" data-tab="capitalizzati">Top Capitalizzati</button>
            <button class="tab-btn" data-tab="categorie">Categorie</button>
        </nav>

        <div class="controls" id="controls-peggiori">
            <div class="period-buttons">
                <button class="period-btn" data-periodo="1s">1S</button>
                <button class="period-btn" data-periodo="1m">1M</button>
                <button class="period-btn active" data-periodo="3m">3M</button>
                <button class="period-btn" data-periodo="6m">6M</button>
                <button class="period-btn" data-periodo="12m">12M</button>
                <button class="period-btn" data-periodo="18m">18M</button>
                <button class="period-btn" data-periodo="24m">24M</button>
            </div>
        </div>

        <div class="controls" id="controls-migliori" style="display: none;">
            <div class="period-buttons">
                <button class="period-btn" data-periodo="1s">1S</button>
                <button class="period-btn" data-periodo="1m">1M</button>
                <button class="period-btn active" data-periodo="3m">3M</button>
                <button class="period-btn" data-periodo="6m">6M</button>
                <button class="period-btn" data-periodo="12m">12M</button>
                <button class="period-btn" data-periodo="18m">18M</button>
                <button class="period-btn" data-periodo="24m">24M</button>
            </div>
        </div>

        <div class="controls" id="controls-categorie" style="display: none;">
            <select id="categoria-select">
                <option value="indici_sviluppati">Indici Sviluppati</option>
                <option value="mercati_emergenti">Mercati Emergenti</option>
                <option value="top_aziende">Top Aziende</option>
                <option value="materie_prime">Materie Prime</option>
                <option value="crypto">Crypto</option>
                <option value="etf_settoriali">ETF Settoriali</option>
            </select>
        </div>

        <div id="contenuto">
            <div class="loading">Caricamento...</div>
        </div>

        <div class="update-info" id="update-info"></div>
    </div>

    <div id="chart-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="chart-title"></h2>
            <div id="chart-container"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
